<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SetPulse — Get on the list</title>
<style>
  :root { --ink:#f0eafa; --mut:#39ff14; --orange:#ff7a00; --card:rgba(255,255,255,0.06); --on:#39ff14; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: radial-gradient(circle at center, #3a1f5d 0%, #1a0f2e 45%, #000000 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding:16px 16px 36px;
  }
  .logo { width:64px; height:64px; border-radius:50%; display:block; margin:0 auto 10px; }
  h1 { font-size:1.3rem; margin:0 0 6px; letter-spacing:-.03em; color:var(--orange); }
  .mut { color:var(--mut); font-size:.92rem; line-height:1.4; }
  .card { background:var(--card); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px; margin-top:14px; }
  label { display:block; font-size:.78rem; color:#b8a9cc; margin:0 0 6px; }
  input { width:100%; min-height:46px; border:0; border-radius:12px; padding:0 12px; font-size:1rem; margin-bottom:12px; }
  button#go { width:100%; min-height:48px; border:0; border-radius:12px; font-weight:700; font-size:1.05rem; background:var(--orange); color:#111; }
  button#go:disabled { opacity:.5; }
  .ok { color:var(--on); font-weight:700; min-height:1.4em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0 14px; }
  .slot { min-height:56px; border:0; border-radius:10px; font-weight:700; background:rgba(57,255,20,0.15); color:#39ff14; font-size:.95rem; }
  .slot.taken { background:rgba(255,255,255,0.08); color:#8a7ba0; font-weight:600; font-size:.72rem; line-height:1.15; }
  .slot.pick { background:var(--orange); color:#111; }
  .viewlink { display:block; text-align:center; margin-top:18px; color:#8a7ba0; font-size:.82rem; text-decoration:underline; }
  footer { margin-top:22px; color:#8a7ba0; font-size:.72rem; text-align:center; line-height:1.4; }
</style>
</head>
<body>
  <img class="logo" src="../../assets/comedy-simulator-logo.png" alt="The Comedy Simulator">
  <h1>Get on the list</h1>
  <p class="mut">Comedy Simulator. Pick an open number. Don't flag the host.</p>
  <p class="mut" id="themeLine" style="display:none; font-weight:700;"></p>
  <p class="mut" style="color:#b8a9cc; font-size:.8rem;">Spots are subject to change and not guaranteed until you're called up.</p>

  <div class="card">
    <label>Stage name</label>
    <input id="name" placeholder="Name as you want it called" autocomplete="name">

    <label>Chat name (optional)</label>
    <input id="chat" placeholder="@handle on YouTube chat" autocomplete="username">

    <label>Social media (optional, shown on stream)</label>
    <input id="social" placeholder="@handle on Instagram/TikTok/etc" autocomplete="off">

    <label>Note (optional)</label>
    <input id="note" placeholder="first time / 5 min" maxlength="80">

    <label>Your spot</label>
    <div class="grid" id="grid"></div>

    <button id="go">Claim this spot</button>
    <p class="ok" id="status"></p>
    <a id="orderlink" href="order.html" style="display:none; text-align:center; margin-top:6px; color:#c9a6ff; font-size:.9rem;">See the live order &rarr;</a>
  </div>

  <a class="viewlink" id="viewlink" href="order.html">Just viewing? See the live order &rarr;</a>

  <footer>SetPulse - live comedy signup</footer>

<script>
const DEFAULT_SHOW = "Comedy Simulator";
const status = document.getElementById("status");
const goBtn = document.getElementById("go");
let pick = 0;
let lastSlots = [];
let loading = false;
function deviceId() {
  try {
    let id = localStorage.getItem("setpulse_device_id");
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2)));
      localStorage.setItem("setpulse_device_id", id);
    }
    return id;
  } catch (e) { return ""; }
}

const DEFAULT_FEED = "https://script.google.com/macros/s/AKfycbzzak7TIvNwJDX_9Ea7S79RU_9jAXaOKdOvE2Uc1cz_AkEdCmvZpVjpkyzHi1RhEwYoEg/exec";
function feedUrl() {
  const q = new URLSearchParams(location.search).get("feed");
  return q || localStorage.getItem("setpulse_webapp") || DEFAULT_FEED;
}

(function () {
  const feed = feedUrl();
  const href = feed === DEFAULT_FEED ? "order.html" : "order.html?feed=" + encodeURIComponent(feed);
  document.getElementById("viewlink").href = href;
  document.getElementById("orderlink").href = href;
})();

let jsonpCounter = 0;
function jsonp(url, params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = "setpulse_cb_" + (jsonpCounter++) + "_" + Date.now();
    const script = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      window[cbName] = () => {};
      script.remove();
      reject(new Error("timeout"));
    }, timeoutMs || 20000);
    function cleanup() {
      clearTimeout(timer);
      script.remove();
      setTimeout(() => { delete window[cbName]; }, 0);
    }
    window[cbName] = (data) => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error("network"));
    };
    const qs = new URLSearchParams(Object.assign({}, params, { callback: cbName, _t: Date.now() })).toString();
    script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + qs;
    document.body.appendChild(script);
  });
}

async function jsonpRetry(url, params) {
  try { return await jsonp(url, params, 20000); }
  catch (e) { return await jsonp(url, params, 20000); }
}

function draw(slots) {
  const list = slots || [];
  lastSlots = list;
  const open = list.filter(s => s.open);
  if (!list.length) {
    document.getElementById("grid").innerHTML = '<p class="mut" style="grid-column:1/-1">Waiting for slots…</p>';
    return;
  }
  document.getElementById("grid").innerHTML = list.map(s => {
    if (s.open) {
      return `<button type="button" class="slot${Number(s.order) === pick ? ' pick' : ''}" data-n="${s.order}">${s.order}</button>`;
    }
    const label = (s.name || "taken").slice(0, 12);
    return `<button type="button" class="slot taken" disabled>${s.order}<br>${label}</button>`;
  }).join("");
  document.querySelectorAll(".slot:not(.taken)").forEach(b => {
    b.onclick = () => { pick = Number(b.dataset.n); draw(lastSlots); };
  });
  if (!open.length) {
    const note = document.createElement("p");
    note.className = "mut";
    note.style.gridColumn = "1/-1";
    note.textContent = "List is full right now.";
    document.getElementById("grid").appendChild(note);
  }
}

async function load() {
  if (loading) return;
  loading = true;
  const feed = feedUrl();
  try {
    const j = await jsonpRetry(feed, { format: "slots" });
    const themeLine = document.getElementById("themeLine");
    if (j.theme) {
      themeLine.textContent = "Tonight's theme: " + j.theme;
      themeLine.style.display = "block";
    } else {
      themeLine.style.display = "none";
    }
    if (!j.signups_open) {
      document.getElementById("grid").innerHTML = '<p class="mut" style="grid-column:1/-1">Signups aren\'t open yet. Check back closer to showtime.</p>';
      goBtn.disabled = true;
      return;
    }
    goBtn.disabled = false;
    draw(j.slots || lastSlots);
    if (status.textContent === "Could not load slots." || status.textContent === "Still catching up…") status.textContent = "";
  } catch (e) {
    if (lastSlots.length) {
      if (!status.textContent || status.textContent === "Could not load slots.") status.textContent = "Still catching up…";
    } else {
      status.textContent = "Could not load slots.";
    }
  } finally {
    loading = false;
  }
}

document.getElementById("go").onclick = async () => {
  if (goBtn.disabled) return;
  const name = document.getElementById("name").value.trim();
  if (!name) { status.textContent = "Need a name."; return; }
  if (!pick) { status.textContent = "Pick an open spot."; return; }
  const feed = feedUrl();
  status.textContent = "Sending...";
  goBtn.disabled = true;
  try {
    const j = await jsonpRetry(feed, {
      action: "claim",
      name,
      order: pick,
      chat_name: document.getElementById("chat").value.trim(),
      social: document.getElementById("social").value.trim(),
      note: document.getElementById("note").value.trim(),
      show: DEFAULT_SHOW,
      source: "list",
      channel: "list_page",
      device_id: deviceId()
    });
    if (j.ok) {
      status.textContent = "You're #" + j.order + ".";
      document.getElementById("name").value = "";
      document.getElementById("chat").value = "";
      document.getElementById("social").value = "";
      document.getElementById("note").value = "";
      pick = 0;
      document.getElementById("orderlink").style.display = "block";
    } else {
      status.textContent = j.error || "That spot is gone.";
    }
    if (j.slots) draw(j.slots);
  } catch (e) {
    status.textContent = "Network miss. Try again.";
  } finally {
    goBtn.disabled = false;
  }
};

load();
setInterval(load, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
