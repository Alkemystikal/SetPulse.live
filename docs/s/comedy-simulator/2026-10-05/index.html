<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comedy Simulator — 2026-10-05</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#f0eafa; --orange:#ff7a00; --mut:#8a7ba0; --pos:#39ff14; --neg:#ff6b6b; }
  body { background: radial-gradient(circle at center, #3a1f5d 0%, #1a0f2e 45%, #000 100%); color:var(--ink); font-family:-apple-system,sans-serif; padding:16px; }
  a { color:#c9a6ff; }
  h1 { color:var(--orange); }
  .playerWrap { position:relative; width:100%; padding-top:56.25%; border-radius:14px; overflow:hidden; background:#000; margin:16px 0; }
  .playerWrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .feed { max-height:420px; overflow-y:auto; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:8px 12px; }
  .row { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:.86rem; }
  .t { color:var(--mut); width:48px; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .author { font-weight:700; color:#c9a6ff; }
  .sent-pos { border-left:2px solid var(--pos); padding-left:8px; }
  .sent-neg { border-left:2px solid var(--neg); padding-left:8px; }
</style>
</head>
<body>
<a href="../">&larr; All nights</a>
<h1>Comedy Simulator — 2026-10-05</h1>
<p>Kill Chino — <span id="count"></span></p>
<div class="playerWrap"><iframe id="player" src="https://www.youtube.com/embed/kv_3S6zyfxE" allowfullscreen></iframe></div>
<div class="feed" id="feed"><p>Loading chat…</p></div>
<script>
async function load() {
  try {
    const res = await fetch('../../../../data/latest/chat.csv');
    if (!res.ok) throw new Error('chat.csv not found');
    const text = await res.text();
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',');
    const rows = lines.slice(1).map(line => {
      const cols = [];
      let field = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
          if (c === '"' && line[i+1] === '"') { field += '"'; i++; }
          else if (c === '"') inQ = false;
          else field += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { cols.push(field); field = ''; }
          else field += c;
        }
      }
      cols.push(field);
      const obj = {};
      headers.forEach((h, i) => obj[h.trim()] = cols[i] || '');
      return obj;
    });
    document.getElementById('count').textContent = rows.length + ' messages';
    document.getElementById('feed').innerHTML = rows.slice(0, 400).map(r => {
      const s = (r.sentiment || '').toLowerCase();
      const cls = s.startsWith('1') || s.startsWith('pos') ? 'sent-pos' : s.startsWith('-') || s.startsWith('neg') ? 'sent-neg' : '';
      const t = Math.round(parseFloat(r.offset_seconds) || 0);
      const m = Math.floor(t/60), sec = t % 60;
      return `<div class="row ${cls}"><div class="t">${m}:${String(sec).padStart(2,'0')}</div><div><span class="author">${r.author || ''}</span> ${r.message || ''}</div></div>`;
    }).join('');
  } catch (e) {
    document.getElementById('feed').innerHTML = '<p>Could not load chat: ' + e.message + '</p>';
  }
}
load();
</script>
</body>
</html>
