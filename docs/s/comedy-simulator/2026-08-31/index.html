<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SetPulse — Night Recap</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --ink:#f0eafa; --orange:#ff7a00; --green:#39ff14; --card:rgba(255,255,255,0.06); --mut:#8a7ba0; --pos:#39ff14; --neg:#ff6b6b; --neu:#8a7ba0; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: radial-gradient(circle at center, #3a1f5d 0%, #1a0f2e 45%, #000000 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 16px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; color: var(--orange); }
  .sub { color: var(--mut); font-size: .88rem; margin: 0 0 18px; }
  .playerWrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 16px; }
  .playerWrap iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
  h2 { font-size: 1rem; color: var(--orange); margin: 22px 0 10px; }
  .comics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .comicBtn {
    background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--ink);
    border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .92rem; cursor: pointer;
  }
  .comicBtn.active { background: var(--orange); color: #111; border-color: var(--orange); }
  .comicBtn .n { display:block; font-weight:400; font-size:.72rem; color:var(--mut); }
  .comicBtn.active .n { color: #442200; }
  .summaryCard { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; margin: 10px 0 18px; display:none; }
  .summaryCard.show { display:block; }
  .sentRow { display:flex; gap:14px; margin-top:6px; font-size:.85rem; }
  .sentRow span.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .feed { display:none; }
  .feed.show { display:block; }
  .row { display:flex; gap:10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); align-items:flex-start; }
  .row .t { color: var(--mut); font-size: .74rem; width: 52px; flex-shrink:0; padding-top:2px; font-variant-numeric: tabular-nums; }
  .row .content { flex: 1; }
  .cue { cursor: pointer; color: var(--ink); }
  .cue:hover { color: var(--orange); text-decoration: underline; }
  .chatMsg { font-size: .86rem; }
  .chatMsg .author { font-weight: 700; color: #c9a6ff; }
  .chatMsg.sent-pos { border-left: 2px solid var(--pos); padding-left: 8px; }
  .chatMsg.sent-neg { border-left: 2px solid var(--neg); padding-left: 8px; }
  .chatMsg.sent-neu { border-left: 2px solid var(--neu); padding-left: 8px; }
  .empty { color: var(--mut); font-size: .9rem; }
  .err { color: #ff6b6b; font-weight: 700; margin: 10px 0; }
  a.back { color: #c9a6ff; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">&larr; All nights</a>
  <h1 id="title">Loading night…</h1>
  <p class="sub" id="dateLine"></p>

  <div class="playerWrap"><div id="player"></div></div>
  <p class="err" id="err"></p>

  <h2>Lineup</h2>
  <div class="comics" id="comics"><p class="empty">Loading lineup…</p></div>

  <div class="summaryCard" id="summaryCard">
    <strong id="summaryName"></strong>
    <div class="sentRow" id="summarySent"></div>
  </div>

  <h2 id="feedTitle" style="display:none">Dialogue &amp; chat</h2>
  <div class="feed" id="feed"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player = null;
let playerReady = false;
let night = null, stats = null, captionSentences = [], chatRows = [];

function fmtT(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

function parseVttTime(t) {
  const parts = t.trim().split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return 0;
}

function parseVtt(text) {
  const cues = [];
  const blocks = text.replace(/\r/g, '').split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.split('\n').filter(Boolean);
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const [startStr, endStr] = timeLine.split('-->').map(s => s.trim().split(' ')[0]);
    const start = parseVttTime(startStr), end = parseVttTime(endStr);
    const textLines = lines.slice(lines.indexOf(timeLine) + 1);
    const cueText = textLines.join(' ').replace(/<[^>]+>/g, '').trim();
    if (!cueText) continue;
    cues.push({ start, end, text: cueText });
  }
  return cues;
}

function normWord(w) {
  return w.toLowerCase().replace(/[^a-z0-9']/g, '');
}

function mergeRollingCaptions(cues) {
  let emittedWords = [];
  const chunks = [];
  let lastT = 0;
  for (const cue of cues) {
    const cueWords = cue.text.split(/\s+/).filter(Boolean);
    if (!cueWords.length) continue;
    const cueNorm = cueWords.map(normWord);
    const maxK = Math.min(emittedWords.length, cueWords.length);
    let k = 0;
    for (let candidate = maxK; candidate >= 1; candidate--) {
      const tail = emittedWords.slice(-candidate).map(w => w.norm);
      const head = cueNorm.slice(0, candidate);
      if (tail.join('|') === head.join('|')) { k = candidate; break; }
    }
    const newWords = cueWords.slice(k);
    if (newWords.length) {
      const span = Math.max(0.01, cue.end - cue.start);
      const per = span / newWords.length;
      newWords.forEach((w, i) => {
        let t = cue.start + per * i;
        t = Math.max(t, lastT + 0.01);
        lastT = t;
        chunks.push({ word: w, t });
        emittedWords.push({ word: w, norm: normWord(w) });
      });
    }
  }
  return chunks;
}

function groupIntoSentences(wordChunks) {
  const sentences = [];
  let current = [];
  for (const wc of wordChunks) {
    current.push(wc);
    const isSpeakerChange = wc.word.startsWith('>>');
    const endsSentence = /[.!?]$/.test(wc.word.replace(/\[.*?\]/g, ''));
    if ((endsSentence || isSpeakerChange) && current.length > 0) {
      if (isSpeakerChange && current.length === 1) continue;
      if (isSpeakerChange) {
        const marker = current.pop();
        sentences.push(current);
        current = [marker];
      } else {
        sentences.push(current);
        current = [];
      }
    }
  }
  if (current.length) sentences.push(current);
  return sentences.map(words => ({
    start: words[0].t,
    end: words[words.length - 1].t,
    text: words.map(w => w.word).join(' '),
    words
  }));
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.length === headers.length).map(r => {
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = r[idx]);
    return obj;
  });
}

function onYouTubeIframeAPIReady() {
  window.__ytApiReady = true;
  maybeInitPlayer();
}

function maybeInitPlayer() {
  if (!window.__ytApiReady || !night || player) return;
  player = new YT.Player('player', {
    videoId: night.video_id,
    playerVars: { rel: 0 },
    events: { onReady: () => { playerReady = true; } }
  });
}

function seekTo(seconds) {
  if (!playerReady) { alert('Player still loading — try again in a moment.'); return; }
  player.seekTo(seconds, true);
  player.playVideo();
}

function sentimentCounts(perfName) {
  const rows = chatRows.filter(r => (r.current_performer || '').trim() === perfName);
  const counts = { pos: 0, neg: 0, neu: 0 };
  rows.forEach(r => {
    const s = (r.sentiment || '').toLowerCase();
    if (s.startsWith('pos')) counts.pos++;
    else if (s.startsWith('neg')) counts.neg++;
    else counts.neu++;
  });
  return counts;
}

function renderComics() {
  const el = document.getElementById('comics');
  if (!stats || !stats.performers || !stats.performers.length) {
    el.innerHTML = '<p class="empty">No performer data for this night yet.</p>';
    return;
  }
  const ordered = stats.performers.slice().sort((a, b) => a.started_video_t - b.started_video_t);
  el.innerHTML = ordered.map(p => {
    const dur = Math.max(0, Math.round((p.ended_video_t - p.started_video_t) / 60));
    return `<button type="button" class="comicBtn" data-name="${p.name.replace(/"/g, '&quot;')}">${p.name}<span class="n">${dur}m set</span></button>`;
  }).join('');
  el.querySelectorAll('.comicBtn').forEach(btn => {
    btn.onclick = () => selectComic(btn.dataset.name);
  });
}

function findIntroLowerBound(perf, prevEnd, sentences) {
  const INTRO_BUFFER = 10;
  const SEARCH_WINDOW = 30;
  const nameLower = perf.name.toLowerCase();
  const searchFrom = Math.max(prevEnd, perf.started_video_t - SEARCH_WINDOW);
  const candidates = sentences.filter(s =>
    s.start >= searchFrom && s.start <= perf.started_video_t + 5 &&
    /give it up for/i.test(s.text) && s.text.toLowerCase().includes(nameLower)
  );
  if (candidates.length) {
    return candidates.sort((a, b) => a.start - b.start)[0].start;
  }
  return Math.max(prevEnd, perf.started_video_t - INTRO_BUFFER);
}

function selectComic(name) {
  document.querySelectorAll('.comicBtn').forEach(b => b.classList.toggle('active', b.dataset.name === name));
  const ordered = stats.performers.slice().sort((a, b) => a.started_video_t - b.started_video_t);
  const idx = ordered.findIndex(p => p.name === name);
  const perf = ordered[idx];
  if (!perf) return;

  seekTo(perf.started_video_t);

  const sc = document.getElementById('summaryCard');
  document.getElementById('summaryName').textContent = name;
  const counts = sentimentCounts(name);
  document.getElementById('summarySent').innerHTML =
    `<span><span class="dot" style="background:var(--pos)"></span>${counts.pos} positive</span>` +
    `<span><span class="dot" style="background:var(--neg)"></span>${counts.neg} negative</span>` +
    `<span><span class="dot" style="background:var(--neu)"></span>${counts.neu} neutral</span>`;
  sc.classList.add('show');

  const prevEnd = idx > 0 ? ordered[idx - 1].ended_video_t : 0;
  const lowerBound = findIntroLowerBound(perf, prevEnd, captionSentences);
  const cues = captionSentences.filter(s => s.start >= lowerBound && s.start < perf.ended_video_t)
    .map(s => ({ kind: 'caption', t: s.start, ...s }));
  const chats = chatRows.filter(r => (r.current_performer || '').trim() === name)
    .map(r => ({ kind: 'chat', t: parseFloat(r.video_t) || 0, ...r }));

  const combined = cues.concat(chats).sort((a, b) => a.t - b.t);

  const feedEl = document.getElementById('feed');
  document.getElementById('feedTitle').style.display = 'block';
  if (!combined.length) {
    feedEl.innerHTML = '<p class="empty">No captions or chat captured for this set.</p>';
  } else {
    feedEl.innerHTML = combined.map(item => {
      if (item.kind === 'caption') {
        const wordSpans = item.words.map(w =>
          `<span class="cue" data-t="${w.t}">${w.word}</span>`
        ).join(' ');
        return `<div class="row"><div class="t">${fmtT(item.t)}</div><div class="content">${wordSpans}</div></div>`;
      }
      const sRaw = (item.sentiment || '').toLowerCase();
      const sCls = sRaw.startsWith('pos') ? 'sent-pos' : sRaw.startsWith('neg') ? 'sent-neg' : 'sent-neu';
      const who = item.chat_name || item.author || 'viewer';
      return `<div class="row"><div class="t">${fmtT(item.t)}</div><div class="content chatMsg ${sCls}"><span class="author">${who}:</span> ${item.text || ''}</div></div>`;
    }).join('');
  }
  feedEl.classList.add('show');
  feedEl.querySelectorAll('.cue').forEach(el => {
    el.onclick = () => seekTo(parseFloat(el.dataset.t));
  });
}

async function load() {
  try {
    const [nightRes, statsRes, vttRes, chatRes] = await Promise.all([
      fetch('night.json'),
      fetch('stats.json'),
      fetch('captions.vtt'),
      fetch('chat.csv')
    ]);
    if (!nightRes.ok) throw new Error('night.json missing');
    night = await nightRes.json();
    document.getElementById('title').textContent = night.title || 'Comedy Simulator';
    document.getElementById('dateLine').textContent = night.date || '';
    maybeInitPlayer();

    stats = statsRes.ok ? await statsRes.json() : { performers: [] };
    const rawCues = vttRes.ok ? parseVtt(await vttRes.text()) : [];
    const wordChunks = mergeRollingCaptions(rawCues);
    captionSentences = groupIntoSentences(wordChunks);
    chatRows = chatRes.ok ? parseCsv(await chatRes.text()) : [];

    renderComics();
  } catch (e) {
    document.getElementById('err').textContent = 'Could not load this night: ' + e.message;
  }
}

load();
</script>
</body>
</html>
