name: SetPulse sentiment archive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      video_id:
        description: "Optional: specific video ID to backfill"
        required: false
      date:
        description: "Optional: show date YYYY-MM-DD"
        required: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    services:
      bgutil-pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U yt-dlp yt-dlp-get-pot bgutil-ytdlp-pot-provider

      - name: Install deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Give the PO token provider a moment
        run: sleep 5

      - name: Write YouTube cookies
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"
            echo "YT_DLP_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run pipeline (auto-detect latest stream)
        if: ${{ github.event.inputs.video_id == '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SETPULSE_ARCHIVE_BASE: ${{ secrets.SETPULSE_ARCHIVE_BASE }}
          SETPULSE_CHANNEL_ID: UC_47Pv7ji6eRoRggwyc25ZQ
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
        run: |
          # Skip if the newest video already has a night folder
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, glob
          key = os.environ["YOUTUBE_API_KEY"]
          cid = os.environ["SETPULSE_CHANNEL_ID"]
          q = urllib.parse.urlencode({"key": key, "channelId": cid, "part": "snippet", "order": "date", "type": "video", "maxResults": 5})
          with urllib.request.urlopen(f"https://www.googleapis.com/youtube/v3/search?{q}") as r:
              data = json.load(r)
          vids = [i["id"]["videoId"] for i in data.get("items", []) if "videoId" in i.get("id", {})]
          archived = set()
          for p in glob.glob("docs/s/comedy-simulator/*/night.json"):
              try:
                  archived.add(json.load(open(p)).get("video_id", ""))
              except Exception:
                  pass
          newest = next((v for v in vids if v not in archived), None)
          if not newest:
              print("Newest streams already archived — skipping")
              open("/tmp/skip", "w").write("1")
          else:
              print(f"Will archive {newest}")
              open("/tmp/skip", "w").write("0")
              open("/tmp/vid", "w").write(newest)
          PY
          if [ "$(cat /tmp/skip)" = "1" ]; then
            echo "Skipping auto run — no new stream"
            exit 0
          fi
          python3 scripts/sentiment_archive.py --auto --out ./data/latest

      - name: Run pipeline (manual backfill)
        if: ${{ github.event.inputs.video_id != '' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SETPULSE_ARCHIVE_BASE: ${{ secrets.SETPULSE_ARCHIVE_BASE }}
          YT_DLP_PROXY: ${{ secrets.YT_DLP_PROXY }}
        run: |
          python3 scripts/sentiment_archive.py \
            --video-id "${{ github.event.inputs.video_id }}" \
            --date "${{ github.event.inputs.date }}" \
            --out ./data/${{ github.event.inputs.date }}

      - name: Write captions.vtt
        if: ${{ github.event.inputs.video_id != '' }}
        run: |
          python3 scripts/write_captions.py \
            --video-id "${{ github.event.inputs.video_id }}" \
            --out ./data/${{ github.event.inputs.date }} || true

      - name: Publish night folder to docs/s/
        run: |
          python3 - <<'PY'
          import json, os, shutil, glob
          from datetime import datetime
          date = os.environ.get("SHOW_DATE", "").strip()
          if not date:
              candidates = sorted(glob.glob("data/20*"))
              if candidates:
                  date = os.path.basename(candidates[-1])
          if not date or date == "latest":
              date = datetime.utcnow().strftime("%Y-%m-%d")
          src = f"data/{date}" if os.path.isdir(f"data/{date}") else "data/latest"
          if not os.path.isdir(src):
              print(f"No data folder found at {src}")
              raise SystemExit(0)
          dest = f"docs/s/comedy-simulator/{date}"
          os.makedirs(dest, exist_ok=True)
          for name in ("chat.csv", "stats.json", "captions.vtt"):
              s = os.path.join(src, name)
              if os.path.exists(s):
                  shutil.copy2(s, os.path.join(dest, name))
                  print(f"copied {name}")
          night_path = os.path.join(dest, "night.json")
          if not os.path.exists(night_path):
              night = {"show": "comedy-simulator", "date": date, "video_id": os.environ.get("VIDEO_ID", ""), "title": "Comedy Simulator", "files": {"chat": "chat.csv", "stats": "stats.json", "captions": "captions.vtt"}}
              with open(night_path, "w") as f:
                  json.dump(night, f, indent=2)
                  f.write("\n")
          nights_path = "docs/s/comedy-simulator/nights.json"
          try:
              nights = json.load(open(nights_path))
          except Exception:
              nights = []
          if not any(n.get("date") == date for n in nights):
              nights.append({"date": date, "video_id": os.environ.get("VIDEO_ID", ""), "title": "Comedy Simulator"})
              with open(nights_path, "w") as f:
                  json.dump(nights, f, indent=2)
                  f.write("\n")
          print("publish step done")
          PY
        env:
          SHOW_DATE: ${{ github.event.inputs.date }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}

      - name: Commit and push results
        run: |
          git config user.name "setpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/s/comedy-simulator/
          git diff --staged --quiet || git commit -m "Auto-archive: sentiment data and night folder $(date -u +%Y-%m-%d)"
          git push
